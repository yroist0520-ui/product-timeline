<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ed">
  <meta name="description" content="PRODUCT TIMELINE — 记录每一次产品创作与发布。真实服务端时间、发布后永久锁定的个人数字产品档案。">
  <title>PRODUCT TIMELINE — 个人产品时间档案</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 异步加载档案字体：网络不可达时立即回落到本地衬线/等宽字体栈，不阻塞首屏 -->
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="ambient" aria-hidden="true"></div>

  <header class="site-header">
    <div class="site-header__inner">
      <a class="brand" href="/" data-link aria-label="PRODUCT TIMELINE 首页">
        <span class="brand__mark" aria-hidden="true"></span>
        <span class="brand__text">PRODUCT<em>TIMELINE</em></span>
      </a>
      <nav class="site-nav" id="site-nav" aria-label="主导航"></nav>
      <a class="quick-publish" id="quick-publish" href="/publish" data-link aria-label="发布作品">
        <span class="quick-publish__icon" aria-hidden="true">＋</span>
        <span class="quick-publish__label">发布作品</span>
      </a>
      <button class="nav-toggle" id="nav-toggle" aria-label="展开导航" aria-expanded="false">
        <span></span><span></span>
      </button>
    </div>
    <div class="header-rule"></div>
  </header>

  <main id="app" class="app-shell" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <span class="footer-mark">PT<span class="dot">.</span></span>
      <p>每一次发布，都是一条不可改写的时间。</p>
      <span class="footer-meta" id="footer-time">UTC · SERVER TIME</span>
    </div>
  </footer>

  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
